<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <rect width="1440" height="900" fill="#020406"/>
  <!-- 그리드 -->
  <g stroke="#7CFF00" stroke-width="0.5" opacity="0.04">
    <line x1="144" y1="0" x2="144" y2="900"/>
    <line x1="288" y1="0" x2="288" y2="900"/>
    <line x1="432" y1="0" x2="432" y2="900"/>
    <line x1="576" y1="0" x2="576" y2="900"/>
    <line x1="720" y1="0" x2="720" y2="900"/>
    <line x1="864" y1="0" x2="864" y2="900"/>
    <line x1="1008" y1="0" x2="1008" y2="900"/>
    <line x1="1152" y1="0" x2="1152" y2="900"/>
    <line x1="1296" y1="0" x2="1296" y2="900"/>
    <line x1="0" y1="150" x2="1440" y2="150"/>
    <line x1="0" y1="300" x2="1440" y2="300"/>
    <line x1="0" y1="450" x2="1440" y2="450"/>
    <line x1="0" y1="600" x2="1440" y2="600"/>
    <line x1="0" y1="750" x2="1440" y2="750"/>
  </g>
  <!-- 글로우 웨이브 (굵은 배경) -->
  <path d="M0,450 C180,290 260,590 440,430 C620,270 680,610 900,450 C1120,290 1180,590 1440,450"
    fill="none" stroke="#7CFF00" stroke-width="20" opacity="0.05" filter="url(#glow)"/>
  <!-- 메인 웨이브 -->
  <path d="M0,450 C180,290 260,590 440,430 C620,270 680,610 900,450 C1120,290 1180,590 1440,450"
    fill="none" stroke="#7CFF00" stroke-width="2" opacity="0.7"/>
  <!-- 보조 웨이브 -->
  <path d="M0,450 C120,390 200,510 360,455 C520,400 620,500 720,450 C820,400 960,500 1080,455 C1200,410 1340,490 1440,450"
    fill="none" stroke="#00D4FF" stroke-width="1" opacity="0.3"/>
  <!-- 기준선 -->
  <line x1="0" y1="450" x2="1440" y2="450" stroke="#7CFF00" stroke-width="0.5" opacity="0.07" stroke-dasharray="4 14"/>
  <!-- 펄스 포인트 -->
  <circle cx="360" cy="430" r="3" fill="#7CFF00" opacity="0.9"/>
  <circle cx="720" cy="450" r="3" fill="#7CFF00" opacity="0.9"/>
  <circle cx="1080" cy="430" r="3" fill="#7CFF00" opacity="0.9"/>
  <!-- 비네팅 -->
  <radialGradient id="vig" cx="50%" cy="50%" r="60%">
    <stop offset="0%" stop-color="#020406" stop-opacity="0.05"/>
    <stop offset="100%" stop-color="#020406" stop-opacity="0.75"/>
  </radialGradient>
  <rect width="1440" height="900" fill="url(#vig)"/>
  <!-- 상하 페이드 -->
  <linearGradient id="topFade" x1="0" x2="0" y1="0" y2="1">
    <stop offset="0%" stop-color="#020406" stop-opacity="0.5"/>
    <stop offset="30%" stop-color="#020406" stop-opacity="0"/>
  </linearGradient>
  <rect width="1440" height="900" fill="url(#topFade)"/>
  <linearGradient id="botFade" x1="0" x2="0" y1="0" y2="1">
    <stop offset="70%" stop-color="#020406" stop-opacity="0"/>
    <stop offset="100%" stop-color="#020406" stop-opacity="0.7"/>
  </linearGradient>
  <rect width="1440" height="900" fill="url(#botFade)"/>
</svg>
